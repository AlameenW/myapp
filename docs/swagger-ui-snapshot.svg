<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Swagger UI snapshot for Tasks API">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2224"/>
      <stop offset="100%" stop-color="#171a1b"/>
    </linearGradient>
    <linearGradient id="rowBlue" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1f3554"/>
      <stop offset="100%" stop-color="#17253b"/>
    </linearGradient>
    <linearGradient id="rowGreen" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#133e37"/>
      <stop offset="100%" stop-color="#102b27"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="14" fill="#3e176f"/>
  <rect y="14" width="1280" height="60" fill="#2a2d2f"/>

  <circle cx="32" cy="44" r="17" fill="#7CFC00"/>
  <text x="24" y="50" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1f2224">{}</text>
  <text x="58" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff">Swagger</text>
  <text x="62" y="65" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#b9b9b9">Supported by SMARTBEAR</text>
  <circle cx="352" cy="42" r="10" fill="#d8d8d8" opacity="0.95"/>
  <rect x="349" y="48" width="6" height="8" rx="2" fill="#d8d8d8" opacity="0.95"/>

  <text x="20" y="158" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#d8d8d8">Tasks API</text>
  <rect x="196" y="126" width="38" height="22" rx="11" fill="#425465"/>
  <text x="205" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1.0</text>
  <rect x="237" y="126" width="66" height="22" rx="11" fill="#1d7a43"/>
  <text x="245" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">OAS 3.0</text>

  <text x="22" y="248" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f0f0f0">default</text>
  <path d="M1208 235 l10 10 l10 -10" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="18" y="272" width="1244" height="40" rx="3" fill="url(#rowBlue)" stroke="#40557a"/>
  <rect x="22" y="277" width="78" height="30" rx="3" fill="#59a1ff"/>
  <text x="44" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#10243e">GET</text>
  <text x="116" y="297" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f4f4f4">/tasks</text>
  <text x="186" y="297" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d4dde9">List all tasks</text>
  <path d="M1208 286 l10 10 l10 -10" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="18" y="325" width="1244" height="40" rx="3" fill="url(#rowGreen)" stroke="#33504d"/>
  <rect x="22" y="330" width="78" height="30" rx="3" fill="#18c47a"/>
  <text x="36" y="350" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#102f24">POST</text>
  <text x="116" y="350" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f4f4f4">/tasks</text>
  <text x="186" y="350" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d4dde9">Create a task</text>
  <path d="M1208 339 l10 10 l10 -10" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="18" y="378" width="1244" height="40" rx="3" fill="url(#rowBlue)" stroke="#40557a"/>
  <rect x="22" y="383" width="78" height="30" rx="3" fill="#59a1ff"/>
  <text x="44" y="403" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#10243e">GET</text>
  <text x="116" y="403" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#f4f4f4">/tasks/{id}</text>
  <text x="231" y="403" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d4dde9">Get one task</text>
  <path d="M1208 392 l10 10 l10 -10" fill="none" stroke="#c8c8c8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
